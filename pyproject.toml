[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aegis-recon"
version = "0.1.0"
description = "Evidence-based, AI-assisted reconnaissance and vulnerability intelligence for authorized security assessments."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "AEGIS-Recon Contributors"},
]
keywords = ["security", "reconnaissance", "vulnerability", "nmap", "CVE", "pentesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.37.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "httpx",  # for TestClient
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = [
    "S603", "S607",  # subprocess calls are validated
    "S310", "S314",  # stdlib urllib and ElementTree are intentional
    "E501",          # line length handled by formatter
    "COM812",        # conflicts with formatter
    "RET505", "RET506", "RET507", "RET508",  # stylistic else/elif after return
    "SIM102", "SIM105", "SIM117",            # stylistic if/with/try simplifications
    "S110",          # try-except-pass is intentional in fallbacks
    "B904",          # raise ... from err chaining
    "N817",          # well-known ET alias for ElementTree (defusedxml)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests as integration tests (may need Nmap or network)",
    "security: marks tests as security tests",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404"]  # subprocess import is required for nmap execution and strictly validated
